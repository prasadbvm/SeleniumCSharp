name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ dev, qa, main ]
  pull_request:
    branches: [ dev, qa, main ]

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "AutomotiveBddProject.slnx"

      - name: Build
        run: dotnet build "AutomotiveBddProject.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "AutomotiveBddProject.slnx" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx" --verbosity normal

      - name: Publish
        run: |
          dotnet publish "AutomotiveBddProject.slnx" -c Release -o publish_output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish_output
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Configure SSH (uses secrets)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Add deploy host to known_hosts
        run: |
          touch ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
      - name: Deploy to DEV host via SCP (placeholder)
        env:
          DEPLOY_HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_USER: ${{ secrets.DEV_USER }}
        run: |
          echo "Deploying to DEV ${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -r publish_output/* ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/app || echo "SCP failed (placeholder)"

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to DEV environment"
          ls -la

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    environment: qa
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Configure SSH (uses secrets)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.QA_SSH_PRIVATE_KEY }}
      - name: Add deploy host to known_hosts
        run: |
          touch ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.QA_HOST }} >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.QA_HOST }}
      - name: Deploy to QA host via SCP (placeholder)
        env:
          DEPLOY_HOST: ${{ secrets.QA_HOST }}
          DEPLOY_USER: ${{ secrets.QA_USER }}
        run: |
          echo "Deploying to QA ${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -r publish_output/* ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/app || echo "SCP failed (placeholder)"

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to QA environment"
          ls -la

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Configure SSH (uses secrets)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      - name: Add deploy host to known_hosts
        run: |
          touch ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
      - name: Deploy to PROD host via SCP (placeholder)
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          echo "Deploying to PROD ${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -r publish_output/* ${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/app || echo "SCP failed (placeholder)"

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to PROD environment"
          ls -la
