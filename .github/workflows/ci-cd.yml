name: CI/CD

on:
  push:
    branches: [ dev, qa, main ]
  pull_request:
    branches: [ dev, qa, main ]

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "AutomotiveBddProject.slnx"

      - name: Build
        run: dotnet build "AutomotiveBddProject.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "AutomotiveBddProject.slnx" --configuration Release --no-build --verbosity normal

      - name: Publish
        run: |
          dotnet publish "AutomotiveBddProject.slnx" -c Release -o publish_output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish_output

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to DEV environment"
          ls -la

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa'
    environment: qa
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to QA environment"
          ls -la

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to PROD environment"
          ls -la
