name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ dev, qa, main ]
  pull_request:
    branches: [ dev, qa, main ]

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "AutomotiveBddProject.slnx"

      - name: Build
        run: dotnet build "AutomotiveBddProject.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "AutomotiveBddProject.slnx" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx" --verbosity normal

      - name: Publish
        run: |
          dotnet publish "AutomotiveBddProject.slnx" -c Release -o publish_output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish_output
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Azure Login (Dev)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.DEV_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Dev)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.DEV_WEBAPP_NAME }}
          package: publish_output

  smoke-dev:
    name: Smoke tests (Dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Run smoke tests against Dev
        env:
          DEV_WEBAPP_NAME: ${{ secrets.DEV_WEBAPP_NAME }}
          DEV_SMOKE_URL: ${{ secrets.DEV_SMOKE_URL }}
        run: |
          set -euo pipefail
          URL="$DEV_SMOKE_URL"
          if [ -z "$URL" ]; then
            if [ -n "$DEV_WEBAPP_NAME" ]; then
              URL="https://${DEV_WEBAPP_NAME}.azurewebsites.net"
            else
              echo "No DEV_SMOKE_URL or DEV_WEBAPP_NAME configured"; exit 1
            fi
          fi
          echo "Testing $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep $((i*2))
          done
          echo "Smoke test failed for $URL"; exit 1

  smoke-qa:
    name: Smoke tests (QA)
    runs-on: ubuntu-latest
    needs: deploy-qa
    steps:
      - name: Run smoke tests against QA
        env:
          QA_WEBAPP_NAME: ${{ secrets.QA_WEBAPP_NAME }}
          QA_SMOKE_URL: ${{ secrets.QA_SMOKE_URL }}
        run: |
          set -euo pipefail
          URL="$QA_SMOKE_URL"
          if [ -z "$URL" ]; then
            if [ -n "$QA_WEBAPP_NAME" ]; then
              URL="https://${QA_WEBAPP_NAME}.azurewebsites.net"
            else
              echo "No QA_SMOKE_URL or QA_WEBAPP_NAME configured"; exit 1
            fi
          fi
          echo "Testing $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep $((i*2))
          done
          echo "Smoke test failed for $URL"; exit 1

  smoke-prod:
    name: Smoke tests (Prod)
    runs-on: ubuntu-latest
    needs: deploy-prod
    steps:
      - name: Run smoke tests against Prod
        env:
          PROD_WEBAPP_NAME: ${{ secrets.PROD_WEBAPP_NAME }}
          PROD_SMOKE_URL: ${{ secrets.PROD_SMOKE_URL }}
        run: |
          set -euo pipefail
          URL="$PROD_SMOKE_URL"
          if [ -z "$URL" ]; then
            if [ -n "$PROD_WEBAPP_NAME" ]; then
              URL="https://${PROD_WEBAPP_NAME}.azurewebsites.net"
            else
              echo "No PROD_SMOKE_URL or PROD_WEBAPP_NAME configured"; exit 1
            fi
          fi
          echo "Testing $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep $((i*2))
          done
          echo "Smoke test failed for $URL"; exit 1

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to DEV environment"
          ls -la

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    environment: qa
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Azure Login (QA)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.QA_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (QA)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.QA_WEBAPP_NAME }}
          package: publish_output

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to QA environment"
          ls -la

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
      - name: Azure Login (Prod)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.PROD_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Prod)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.PROD_WEBAPP_NAME }}
          package: publish_output

      - name: Deploy (placeholder)
        run: |
          echo "Deploying to PROD environment"
          ls -la
